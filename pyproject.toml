[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-hypnosis"
version = "0.1.0"
description = "Model Hypnosis: controlling AI via additive subliminal cue effects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Enric Boix-Adsera" },
    { name = "Benedict Tessler" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# GPU experiments (make experiments): local open-weight forward passes via vLLM.
gpu = ["torch>=2.4", "transformers>=4.45", "vllm>=0.10", "huggingface_hub>=0.24"]
# API-model steering (Section 3.2, closed-weight reasoning models).
api = ["httpx>=0.27"]

[tool.setuptools]
packages = ["subliminal", "mhyp", "mhyp.api_steering"]
